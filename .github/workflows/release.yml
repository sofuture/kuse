name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist

          artifact_base="kuse_${VERSION}_${GOOS}_${GOARCH}"
          binary_name="kuse"

          if [ "${GOOS}" = "windows" ]; then
            binary_name="${binary_name}.exe"
          fi

          package_dir="$(mktemp -d)"
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o "${package_dir}/${binary_name}" ./cmd/kuse

          if [ "${GOOS}" = "windows" ]; then
            (
              cd "${package_dir}"
              zip -q "${GITHUB_WORKSPACE}/dist/${artifact_base}.zip" "${binary_name}"
            )
          else
            tar -C "${package_dir}" -czf "dist/${artifact_base}.tar.gz" "${binary_name}"
          fi

          rm -rf "${package_dir}"

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/kuse_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}.*
          if-no-files-found: error

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      attestations: write
      id-token: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum kuse_* > "kuse_${GITHUB_REF_NAME}_checksums.txt"

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/kuse_*"

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/kuse_*
          generate_release_notes: true
